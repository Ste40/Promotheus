<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="820" viewBox="0 0 2000 820" role="img" aria-labelledby="title desc">
<title id="title">Promotheus Nextflow metro map</title><desc id="desc">Validated inputs feed independent orthology and RNA-Seq routes. Merged orthology also feeds Microarray analysis. All routes converge at integration, followed by output validation. Rockhopper is optional within RNA_ANALYZE.</desc>
<rect width="2000" height="820" fill="#282828"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#ededed}.title{font-size:38px;font-weight:700}.section{font-size:20px;font-weight:700;fill:#ccc}.label{font-size:20px;font-weight:700}.detail{font-size:16px;fill:#bdbdbd}.code{font-family:monospace;font-size:14px;fill:#aaa}</style>
