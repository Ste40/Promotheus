<text x="240" y="508" class="name" text-anchor="middle">Check study details</text>
<text x="195" y="594" class="note" text-anchor="middle">Select studies and species</text>
<text x="195" y="619" class="tech" text-anchor="middle">NCBI GEO · series IDs (GSE)</text>
<rect x="564" y="297.0" width="12" height="26" rx="5" stroke="#58616b" stroke-width="1.5" fill="#fff"/>
<text x="570" y="278" class="name" text-anchor="middle">Prepare genomes</text>
<text x="570" y="354" class="body" text-anchor="middle">Retrieve reference genomes</text>
<text x="570" y="378" class="tech" text-anchor="middle">NCBI RefSeq</text>
<rect x="894" y="297.0" width="12" height="26" rx="5" stroke="#58616b" stroke-width="1.5" fill="#fff"/>
<text x="900" y="278" class="name" text-anchor="middle">Find matching genes</text>
<text x="900" y="354" class="body" text-anchor="middle">Identify corresponding genes</text>
<text x="900" y="378" class="tech" text-anchor="middle">OrthoFinder · orthology</text>
<rect x="1254" y="297.0" width="12" height="26" rx="5" stroke="#58616b" stroke-width="1.5" fill="#fff"/>
<text x="1260" y="278" class="name" text-anchor="middle">Combine gene matches</text>
<text x="1290" y="365" class="note" text-anchor="start" style="fill:#008fcb">Gene matches</text>
<rect x="1254" y="527.0" width="12" height="26" rx="5" stroke="#58616b" stroke-width="1.5" fill="#fff"/>
<text x="1230" y="580" class="name" text-anchor="middle">Analyze expression</text>
<text x="1230" y="607" class="note" text-anchor="middle">Download and normalize array data</text>
<text x="1230" y="630" class="tech" text-anchor="middle">GEO supplementary files · expression analysis</text>
<rect x="564" y="807.0" width="12" height="26" rx="5" stroke="#58616b" stroke-width="1.5" fill="#fff"/>
<text x="570" y="788" class="name" text-anchor="middle">Download study data</text>
<text x="570" y="864" class="body" text-anchor="middle">Retrieve sequencing data</text>
<text x="570" y="889" class="tech" text-anchor="middle">GEO / GSE · SRA reads (SRR)</text>
<rect x="894" y="807.0" width="12" height="26" rx="5" stroke="#58616b" stroke-width="1.5" fill="#fff"/>
<text x="900" y="788" class="name" text-anchor="middle">Map reads to the genome</text>
<text x="900" y="864" class="body" text-anchor="middle">Assign reads to genomic locations</text>
<text x="900" y="889" class="tech" text-anchor="middle">Rsubread</text>
<rect x="1254" y="807.0" width="12" height="26" rx="5" stroke="#58616b" stroke-width="1.5" fill="#fff"/>
<text x="1260" y="788" class="name" text-anchor="middle">Measure gene expression</text>
<text x="1260" y="864" class="body" text-anchor="middle">Estimate how active each gene is</text>
<text x="1260" y="889" class="tech" text-anchor="middle">featureCounts · DESeq2</text>
<text x="1260" y="919" class="tech" text-anchor="middle">Rockhopper · optional operon detection¹</text>
<text x="1560" y="263" class="name" text-anchor="start">Bring studies together</text>
<circle cx="1564" cy="292" r="2.5" fill="#666"/>
<text x="1577" y="298" class="note" text-anchor="start">Link results through matching genes</text>
<circle cx="1564" cy="323" r="2.5" fill="#666"/>
<text x="1577" y="329" class="note" text-anchor="start">Correct study effects (ComBat)</text>
<circle cx="1564" cy="354" r="2.5" fill="#666"/>
<text x="1577" y="360" class="note" text-anchor="start">Summarize expression and variability</text>
<circle cx="1564" cy="385" r="2.5" fill="#666"/>
<text x="1577" y="391" class="note" text-anchor="start">Retrieve promoter sequences</text>
<rect x="1624" y="516.0" width="12" height="48" rx="5" stroke="#58616b" stroke-width="1.5" fill="#fff"/>
<text x="1630" y="493" class="name" text-anchor="middle">Combine</text>
<rect x="1844" y="527.0" width="12" height="26" rx="5" stroke="#58616b" stroke-width="1.5" fill="#fff"/>
<text x="1850" y="493" class="name" text-anchor="middle">Check results</text>
<text x="1745" y="623" class="note" text-anchor="middle">Check completeness and consistency</text>
<rect x="1560" y="735" width="370" height="175" stroke="#999" fill="#fff"/>
<text x="1584" y="774" class="name" text-anchor="start">Results</text>
<text x="1584" y="809" class="body" text-anchor="start">Expression, percentiles and CV</text>
<text x="1584" y="840" class="body" text-anchor="start">Promoter sequences</text>
<text x="1584" y="880" class="note" text-anchor="start">XLSX / TSV + validation report</text>
