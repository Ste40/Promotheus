<text x="1170" y="604" class="label" text-anchor="middle">Counts &amp; expression</text>
<text x="1170" y="678" class="code" text-anchor="middle">RNA_ANALYZE</text>
<text x="1170" y="704" class="detail" text-anchor="middle">featureCounts · DESeq2</text>
<text x="1170" y="586" class="detail" text-anchor="middle">+ Rockhopper (optional)</text>
<rect x="1524" y="397" width="12" height="26" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
<text x="1530" y="379" class="label" text-anchor="middle">Integrate</text>
<text x="1530" y="453" class="code" text-anchor="middle">INTEGRATE_RESULTS</text>
<rect x="1744" y="397" width="12" height="26" rx="6" fill="#fff" stroke="#222" stroke-width="2"/>
