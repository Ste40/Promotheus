<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1120" viewBox="0 0 2000 1120" role="img" aria-labelledby="title description">
<title id="title">Promotheus workflow</title>
<desc id="description">Check selected studies and compare reference genomes to match genes. Download and analyze Microarray and RNA-seq data along separate routes. Gene matches support Microarray analysis and the final integration. Combine studies, check results and produce tables of gene expression, variability and promoter sequences. Optional operon analysis identifies genes transcribed together.</desc>
<rect width="2000" height="1120" fill="white"/>
<style>
text {font-family:Arial,Helvetica,sans-serif;fill:#252525}
.title {font-size:30px;font-weight:700}
.subtitle {font-size:19px;fill:#555}
.heading {font-size:21px;font-weight:700}
.name {font-size:21px;font-weight:700}
.body {font-size:18px;fill:#454545}
.note {font-size:17px;fill:#666}
.tech {font-size:16px;fill:#666}
</style>
<text x="40" y="65" class="title" text-anchor="start">Promotheus workflow</text>
<text x="40" y="101" class="subtitle" text-anchor="start">From public gene expression studies to promoter profiles</text>
<rect x="40" y="420" width="310" height="220" stroke="#d2d2d2" fill="none"/>
<text x="60" y="457" class="heading" text-anchor="start">1. Select studies</text>
<rect x="440" y="170" width="990" height="220" stroke="#d2d2d2" fill="none"/>
<text x="460" y="207" class="heading" text-anchor="start">2. Compare genomes</text>
<text x="1400" y="207" class="note" text-anchor="end">Genomes can be compared in parallel</text>
<rect x="1030" y="460" width="400" height="180" stroke="#d2d2d2" fill="none"/>
<text x="1050" y="497" class="heading" text-anchor="start">3. Microarray data</text>
<rect x="440" y="700" width="990" height="240" stroke="#d2d2d2" fill="none"/>
<text x="460" y="737" class="heading" text-anchor="start">4. RNA-seq data</text>
<text x="1400" y="737" class="note" text-anchor="end">Studies can be processed in parallel</text>
<rect x="1530" y="170" width="430" height="770" stroke="#d2d2d2" fill="none"/>
<text x="1550" y="207" class="heading" text-anchor="start">5. Combine &amp; check results</text>
