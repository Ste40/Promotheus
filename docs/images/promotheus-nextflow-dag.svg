<text x="1306" y="1034" class="note" text-anchor="start">Selected studies</text>
<text x="40" y="1065" class="tech" text-anchor="start">GSE: GEO study accession.   SRA: sequencing-read archive.   SRR: SRA run accession.</text>
<text x="40" y="1094" class="note" text-anchor="start">¹ Operons are groups of genes transcribed together. Their detection is optional within RNA-seq analysis.</text>
</svg>
