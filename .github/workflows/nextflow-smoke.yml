name: nextflow-smoke

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Install R test dependencies
        run: Rscript -e 'install.packages("openxlsx", repos = "https://cloud.r-project.org")'

      - name: Install Nextflow
        env:
          NXF_VER: '25.04.2'
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Run validation and end-to-end mock tests
        run: bash tests/shell/test_all.sh
