<path d="M465 770 h32" fill="none" stroke="#ff9a24" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="510" y="776" class="detail" text-anchor="start">RNA-Seq</text>
<path d="M670 770 h32" fill="none" stroke="#c78cec" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="715" y="776" class="detail" text-anchor="start">Final results</text>
<text x="1020" y="765" class="detail" text-anchor="start">Operons enabled: RNA_ANALYZE groups GSEs by organism.</text>
<text x="1020" y="791" class="detail" text-anchor="start">Stations = Nextflow processes; dashed line = validated input shards.</text>
