<rect x="445" y="130" width="920" height="170" rx="12" fill="#353535" stroke="#515151"/>
<text x="445" y="115" class="section" text-anchor="start">2  Orthology · parallel by genome</text>
<rect x="445" y="350" width="920" height="150" rx="12" fill="#353535" stroke="#515151"/>
<text x="445" y="335" class="section" text-anchor="start">3  Microarray · parallel by GSE</text>
<rect x="445" y="550" width="920" height="170" rx="12" fill="#353535" stroke="#515151"/>
<text x="445" y="535" class="section" text-anchor="start">4  RNA-Seq · parallel download / alignment by GSE</text>
<rect x="1420" y="320" width="550" height="210" rx="12" fill="#353535" stroke="#515151"/>
<text x="1420" y="305" class="section" text-anchor="start">5  Integration &amp; validation</text>
